services:
  site:
    build:
      context: .
      dockerfile: docker/base44/Dockerfile
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        bundle check > /dev/null || bundle install --jobs 4 --retry 3
        exec bundle exec jekyll serve --host 0.0.0.0 --port 4000 --watch --incremental --baseurl ''
    ports:
      - "3000:4000"
    volumes:
      - .:/app
    environment:
      - JEKYLL_ENV=development
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: "Open Source Guides"
      base44.kind: "web"
      base44.port: "3000"
